name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: checkout the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JVM
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: sbt/setup-sbt@v1

      # Reads mise.toml, the file Clever's build installs Node from too.
      - uses: jdx/mise-action@v5

      # setup-node's npm cache went with setup-node; the lockfile hash retires this one.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The deploy's own script, so every push runs it before production first does.
      - name: build the page
        run: ./clevercloud/build-frontend.sh

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test coverage
        run: sbt qa

      - name: Codecov
        uses: codecov/codecov-action@v7

      # After sbt qa, which writes the snapshots the contract test reads.
      - name: frontend unit tests
        run: npm run test:unit

      # The generated types are committed, so an endpoint change must regenerate them in its PR.
      - name: generated API types are current
        run: |
          sbt genOpenApi
          npm run gen:api
          if [ -n "$(git status --porcelain -- frontend/src/protocol/generated)" ]; then
            git diff -- frontend/src/protocol/generated
            exit 1
          fi

      # npm test builds and stages first through its pre-hook, so CI has no stage step of its own.
      - name: node tests
        run: npm test

      # The browsers are ~120MB a run; the lockfile hash retires the cache on a playwright bump.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: install the browser system dependencies
        run: npx playwright install-deps chromium firefox

      - name: install the browsers
        run: npx playwright install chromium firefox

      - name: browser tests
        run: npm run e2e

      # Not failure(): running on every build boots the action, so a bump that breaks its runtime
      # goes red here rather than on the first real e2e failure.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

  style-check:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JVM
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: sbt/setup-sbt@v1

      - name: styleCheck
        run: sbt styleCheck
