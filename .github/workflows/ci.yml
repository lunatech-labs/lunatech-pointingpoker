name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: checkout the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JVM
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '21'

      - uses: sbt/setup-sbt@v1
      
      - name: test coverage
        run: sbt qa

      - name: Codecov
        uses: codecov/codecov-action@v7

      - name: stage the app for the node tests
        run: sbt "; coverageOff; Universal/stage"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: node tests
        run: node --test "test/**/*.test.js"

      # --no-audit drops the registry call that once stalled for npm's full 300s fetch-timeout.
      - name: install node dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000

      # The browsers are ~120MB a run; the lockfile hash retires the cache on a playwright bump.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: install the browser system dependencies
        run: npx playwright install-deps chromium firefox

      - name: install the browsers
        run: npx playwright install chromium firefox

      - name: browser tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

  style-check:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JVM
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '21'

      - uses: sbt/setup-sbt@v1

      - name: styleCheck
        run: sbt styleCheck
