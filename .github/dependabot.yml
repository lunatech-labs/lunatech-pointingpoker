version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    # Ends in a paren, so dependabot appends the colon itself.
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    ignore:
      # openapi-typescript needs TypeScript 5, and typescript-eslint stops before 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # @playwright/test is a devDependency, so it takes the -dev prefix.
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
