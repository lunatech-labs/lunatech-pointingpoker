pekko.loglevel = "DEBUG"
pekko.loglevel = ${?PEKKO_LOGLEVEL}

pointing-poker {

  service {
    host = "localhost"
    host = ${?HOST}
    port = 8080
    port = ${?PORT}
    timeout = 5s
    timeout = ${?TIMEOUT}
    index-path = "src/main/resources/pages/index.html"
    index-path = ${?INDEX_PATH}
    secure-cookies = true
    secure-cookies = ${?SECURE_COOKIES}
  }

  sse {
    # How long a Room waits after a disconnect before announcing a Leave, so a reconnect
    # within the window is invisible. Heuristic, not measured; current value: 6 seconds.
    # See docs/superpowers/specs/2026-08-24-sse-backpressure-design.md.
    grace-period = 6s
    grace-period = ${?SSE_GRACE_PERIOD}

    # How long a browser's EventSource waits before reconnecting after an SSE stream ends.
    # Heuristic, not measured; current value: 2000 milliseconds. See the design doc above.
    retry = 2000ms
    retry = ${?SSE_RETRY}
  }

  probe {
    # Proxy-measurement probe, off everywhere by default. Turn on only for the duration of a
    # run. See docs/superpowers/specs/2026-08-28-sse-snapshot-protocol-design.md.
    enabled = false
    enabled = ${?SSE_PROBE_ENABLED}

    page-path = "src/main/resources/pages/probe.html"
    page-path = ${?SSE_PROBE_PAGE_PATH}

    # Applied to the server binding only while the probe is on. Pekko's 60s default closes the
    # silent probes before their budget, which measures this server instead of the proxy.
    idle-timeout = 3m
    idle-timeout = ${?SSE_PROBE_IDLE_TIMEOUT}
  }
}