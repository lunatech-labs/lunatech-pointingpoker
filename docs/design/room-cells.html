<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room mockup, layout cells (ui refresh steps 3b1 to 3b3)</title>
<style>
  body { margin: 0; padding: 16px; background: #E7E2DC; font: 14px/1.4 system-ui, sans-serif; color: #1C1917; }
  .bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; position: sticky; top: 0; background: #E7E2DC; padding: 8px 0; z-index: 1; }
  .bar fieldset { border: 1px solid #B9AD9F; padding: 4px 8px; margin: 0; }
  .bar legend { font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--w) * var(--s)), 1fr)); gap: 24px; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 6px; }
  .frame { width: calc(var(--w) * var(--s)); height: calc(var(--h) * var(--s)); overflow: hidden; outline: 1px solid #8A7A70; background: #fff; }
  iframe { width: var(--w); height: var(--h); border: 0; transform: scale(var(--s)); transform-origin: 0 0; }
</style>
</head>
<body>
<p style="margin:0 0 8px;max-width:80rem"><b>Pointing Poker, the room page.</b> Every cell is the page at the chosen width. Solid is step 4, dashed is a later step. "Open alone" shows a cell at your window's size, with the probe, and is clickable (cards, Show votes, Re-vote, Clear, Copy link).</p>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<script>
// Each cell is room.html at the chosen width; "open alone" shows one at the window's own size.
const long = 'Rework the login page so that a returning user lands on their last room, and keep the room list in sync with the rooms they were invited to since their last visit, including the rooms that were renamed or archived meanwhile by a facilitator'
const options = {
  role: [['voter', 'Voter'], ['facilitator', 'Facilitator']],
  phase: [['voting', 'Voting'], ['revote', 'After a re-vote'], ['revealed', 'Revealed'], ['revealed-revote', 'Revealed after a re-vote']],
  votes: [['sample', 'One most voted'], ['tie3', 'Three tied'], ['tie4', 'Four tied'], ['0', 'Nobody voted']],
  voters: [['14', '14 voters'], ['12', '12 voters'], ['4', '4 voters']],
  later: [['0', 'Step 4 only'], ['1', 'With later steps, dashed: progress, round history, Next issue, the tie rule']],
  issue: [['https://lunatech.atlassian.net/browse/PP-1234', 'Issue: a link'], ['Rework the login page so that a returning user lands on their last room, and keep the room list in sync', 'free text'], [long, 'long free text']],
  layout: [['deck-bottom', 'f. Deck or result above the bar (default)'], ['deck-top', 'g. Deck or result on top (the open swap)']],
  message: [['', 'No message'], ['lost', 'Connection lost'], ['restarted', 'Reconnected'], ['moved', 'Moved link'], ['lost,moved', 'Lost + moved'],
    ['restarted,moved', 'Restarted + moved'], ['conflict', 'Issue changed by someone else (editor)'], ['conflict,save-failed', 'Both editor messages'], ['save-failed', 'Issue save failed (editor)']],
  edit: [['', 'Reading'], ['1', 'Editing'], ['saving', 'Saving']],
  width: [['1280', '1280 (wide layout)'], ['1000', '1000 (compact foot)'], ['800', '800 (phone layout)'], ['392', '392 (a phone)']],
  height: [['680', '680 (comfort)'], ['600', '600 (floor)'], ['900', '900'], ['743', '743 (a phone)']],
  scale: [['0.5', '50%'], ['0.75', '75%'], ['1', 'Actual size']]
}
const multi = ['role', 'phase']
const state = { role: ['voter', 'facilitator'], phase: ['voting', 'revote', 'revealed'], votes: 'sample', voters: '14', later: '0', message: '', edit: '', layout: 'deck-bottom', issue: options.issue[0][0], width: '1280', height: '680', scale: '0.5' }
const bar = document.getElementById('bar')
for (const [key, list] of Object.entries(options)) {
  const fs = document.createElement('fieldset')
  fs.innerHTML = `<legend>${key}</legend>` + list.map(([v, label]) => {
    const type = multi.includes(key) ? 'checkbox' : 'radio', on = multi.includes(key) ? state[key].includes(v) : state[key] === v
    return `<label><input type="${type}" name="${key}" value="${v}" ${on ? 'checked' : ''}> ${label}</label> `
  }).join('')
  fs.addEventListener('change', () => { const picked = [...fs.querySelectorAll('input:checked')].map(i => i.value); state[key] = multi.includes(key) ? picked : picked[0]; render() })
  bar.append(fs)
}
function render() {
  document.getElementById('grid').style.setProperty('--s', state.scale)
  document.getElementById('grid').style.setProperty('--w', `${state.width}px`)
  document.getElementById('grid').innerHTML = state.role.flatMap(role => state.phase.map(phase => {
    const src = `room.html?role=${role}&phase=${phase}&votes=${state.votes}&voters=${state.voters}&later=${state.later}&message=${state.message}&edit=${state.edit}&layout=${state.layout}&issue=${encodeURIComponent(state.issue)}`
    return `<figure><figcaption>${role}, ${phase} — <a href="${src}&probe=1" target="_blank">open alone</a></figcaption>
      <div class="frame" style="--s:${state.scale};--w:${state.width}px;--h:${state.height}px"><iframe src="${src}" title="${role} ${phase}"></iframe></div></figure>`
  })).join('')
}
render()
</script>
</body>
</html>
