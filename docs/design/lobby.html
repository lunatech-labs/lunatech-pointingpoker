<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby mockup (ui refresh step 3b4)</title>
<link rel="stylesheet" href="../../frontend/src/colours.css">
<link rel="stylesheet" href="../../frontend/src/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  * { box-sizing: border-box; }
  html { font-size: var(--root-size); scrollbar-gutter: stable; }
  body { margin: 0; background: var(--paper-pale); color: var(--ink); font: var(--weight-regular) var(--text-md)/var(--leading-body) var(--font-sans); }
  a { color: var(--ink); }
  button, input { font: inherit; color: inherit; }
  svg { width: var(--icon); height: var(--icon); flex: none; }
  :focus-visible { outline: var(--focus-width) solid var(--ink); outline-offset: var(--focus-gap); }

  /* Decisions 2 and 3: the room page's header bar, then one centred column that the header's content, the banners and the panel share */
  .lobby-page-column { width: min(var(--lobby-width), 100% - 2 * var(--page-edge)); margin-inline: auto; }
  .lobby-page-header { height: var(--header-height); display: flex; align-items: center; background: var(--paper-warm); border-bottom: var(--line-hairline) solid var(--hairline-colour); }
  .lobby-page-header .lobby-page-column { display: flex; align-items: center; gap: var(--panel-gap); }
  .brand-logo {
    height: var(--brand-height); aspect-ratio: 11 / 15; border-radius: var(--radius-mark); background: var(--card-back); color: var(--paper-warm);
    display: grid; place-items: center; box-shadow: calc(-1 * var(--space-1)) var(--space-1) 0 var(--mark-offset); margin-left: var(--space-1);
  }
  .brand-logo svg { width: 62%; height: auto; }
  .brand-logo-name { font-weight: var(--weight-bold); font-size: var(--text-md); }
  .lobby-page-main { padding-block: var(--panel-gap) var(--space-6); }

  /* J6's banners, as the room page draws them, in the column (decision 10) */
  .lobby-page-banners { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--panel-gap); }
  .message {
    display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
    background: var(--paper-warm); border: var(--line-hairline) solid var(--hairline-colour); border-left: var(--line-bar) solid var(--ink);
    border-radius: var(--radius); box-shadow: var(--shadow) var(--shadow-colour); font-weight: var(--weight-medium);
  }
  .message p { flex: 1; min-width: 0; margin: 0; overflow-wrap: anywhere; }
  .message .button-quiet { display: flex; align-items: center; justify-content: center; min-width: var(--target-min); min-height: var(--target-min); padding: var(--space-2); background: none; border: 0; cursor: pointer; }
  .message-problem { background: var(--burgundy-tint); color: var(--burgundy-deep); border-left-color: var(--burgundy-deep); }
  .message-notice { background: var(--notice-ground); color: var(--notice-ink); border-left-color: var(--notice-bar); }
  .message-notice svg { color: var(--notice-bar); }

  .panel { background: var(--paper-warm); border-radius: var(--radius); box-shadow: var(--shadow) var(--shadow-colour); padding: var(--space-4) var(--panel-inline) var(--space-5); }
  .lobby-page-title { margin: 0 0 var(--space-3); font: var(--weight-strong) var(--text-lg)/var(--leading-tight) var(--font-sans); }
  /* Decision 12: the typed name wraps anywhere; its bdi isolates it, so a pasted bidi character cannot reorder the sentence */
  .lobby-page-title code { display: block; width: fit-content; max-width: 100%; margin-bottom: var(--space-1); padding: var(--space-1) var(--space-2); background: var(--paper-pale); border-radius: var(--radius-small); font: var(--weight-medium) var(--text-md)/var(--leading-body) var(--font-mono); overflow-wrap: anywhere; }

  /* The room row (Terms): the square, the id and a second line, the arrow; the whole row is the link */
  .room-row { display: flex; align-items: center; gap: var(--space-3); min-height: var(--target-min); margin-bottom: var(--space-4); padding: var(--space-2) var(--space-3); background: var(--paper-pale); border: var(--line-hairline) solid var(--hairline-colour); border-radius: var(--radius-card); color: var(--ink); text-decoration: none; }
  .room-row-square { width: var(--space-6); height: var(--space-6); flex: none; border-radius: var(--radius-mark); background: var(--card-back); }
  .room-row .room-row-text { flex: 1; min-width: 0; }
  .room-row-id { display: block; font: var(--weight-medium) var(--text-sm)/var(--leading-body) var(--font-mono); overflow-wrap: break-word; }
  .room-row-line2 { display: block; font-size: var(--text-sm); text-decoration: underline; overflow-wrap: anywhere; }
  .room-row-go { display: grid; place-items: center; width: var(--space-6); height: var(--space-6); flex: none; margin-left: auto; }
  /* Decision 9: the arrow is a burgundy chip only where the row is the page's primary; rejoin=chip outlines the root's arrow */
  .room-row-go-primary { background: var(--burgundy); color: var(--paper-warm); border-radius: var(--radius-card); }
  .room-row-go-chip { background: var(--paper-warm); border: var(--line-control) solid var(--ink); border-radius: var(--radius-card); }
  .lobby-page-lead { margin: 0 0 var(--space-2); font-weight: var(--weight-strong); }

  /* Decision 6: links; the active one is bold with a bar, the others underlined (J4) */
  .lobby-tabs { display: flex; gap: var(--space-1); margin: 0 0 var(--space-4); border-bottom: var(--line-hairline) solid var(--hairline-colour); }
  .lobby-tabs a { display: flex; align-items: center; min-height: var(--target-min); padding-inline: var(--space-3); }
  .lobby-tabs a[aria-current] { font-weight: var(--weight-strong); text-decoration: none; border-bottom: var(--line-bar) solid var(--ink); margin-bottom: calc(-1 * var(--line-hairline)); }

  .lobby-form-label { display: block; padding: 0; margin-bottom: var(--space-1); font-size: var(--text-sm); font-weight: var(--weight-strong); }
  .lobby-form-input { display: block; width: 100%; min-height: var(--target-min); margin-bottom: var(--space-4); padding-inline: var(--space-3); background: var(--paper-warm); border: var(--line-control) solid var(--mute-soft); border-radius: var(--radius-card); }
  .lobby-form-input-mono { font-family: var(--font-mono); }
  /* Decision 7: the help line stays against the radios, the larger gap after it */
  .lobby-form-roles { min-width: 0; margin: 0 0 var(--space-5); padding: 0; border: 0; }
  .lobby-form-radios { display: flex; flex-wrap: wrap; gap: 0 var(--space-5); }
  .lobby-form-radios .lobby-form-label { display: flex; align-items: center; gap: var(--space-2); min-height: var(--target-min); margin: 0; font-size: var(--text-md); font-weight: var(--weight-regular); }
  .lobby-form-radio { width: var(--icon); height: var(--icon); margin: 0; accent-color: var(--ink); }
  .lobby-form-help { display: block; font-size: var(--text-sm); color: var(--grey); }

  .button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: var(--target-min); padding-inline: var(--space-4); border: var(--line-control) solid transparent; border-radius: var(--radius-control); font-weight: var(--weight-strong); text-decoration: none; cursor: pointer; }
  .button-primary { background: var(--burgundy); color: var(--paper-warm); }
  .button-outline { background: var(--paper-warm); border-color: var(--ink); color: var(--ink); }
  .button + .button { margin-top: var(--space-3); }

  /* Decision 11: inert after "session ended"; the muted look, on the pale ground since grey on the track is 6.47:1, below J8's 7:1 for text */
  .lobby-page-inert .lobby-form-input:disabled, .lobby-page-inert .button:disabled { background: var(--paper-pale); color: var(--grey); border-color: var(--hairline-colour); cursor: default; }
  .lobby-page-inert .lobby-form-radios .lobby-form-label, .lobby-page-inert .lobby-form-label { color: var(--grey); }
  .lobby-page-inert .lobby-form-radio:disabled { accent-color: var(--grey); }

  @media (forced-colors: active) {
    .room-row-square, .brand-logo, .room-row-go-primary { forced-color-adjust: none; background: CanvasText; color: Canvas; }
    .lobby-page-inert .lobby-form-input:disabled, .lobby-page-inert .button:disabled { color: GrayText; border-color: GrayText; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Parameters: page (root | pinned | notaroom), tab, name, remembered (slug | legacy | none), rejoin=chip, role, message (comma list), room, typed, suggestion,
// stored, longest=1 (the 26-character id), probe=1; the lobby-cells page lists each with its meaning.
const q = new URLSearchParams(location.search)
const page = q.get('page') || 'root'
let tab = q.get('tab') === 'join' ? 'join' : 'create'
const longest = q.get('longest') === '1', longId = 'fearless-speckled-flamingo'
const id = fallback => longest ? longId : fallback
const typed = q.get('typed') ?? (longest ? `${longId}s` : 'brave-golden-oter')
const suggestion = q.has('suggestion') ? q.get('suggestion') : id('brave-golden-otter')
const room = q.get('room') || id('brave-golden-otter')
const stored = q.get('stored') ?? 'Alice'
const typedName = q.get('name') ?? 'Alice'
const typedLabel = typedName.trim()   // a blank typed name reads like none
const remembered = q.get('remembered') || 'slug'
const chip = q.get('rejoin') === 'chip'
const role = q.get('role') === 'facilitator' ? 'Facilitator' : 'Voter'
// Only the forms that can show a message draw it: a stream exists on the pinned form alone, Create on the root form alone
const shown = { root: ['join-failed', 'create-failed', 'moved', 'restarted'], pinned: ['join-failed', 'lost', 'ended', 'moved', 'restarted'] }[page] || []
const flags = (q.get('message') || '').split(',').filter(f => shown.includes(f))
const ended = flags.includes('ended')

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${d}"/></svg>`
const alertIcon = icon('M12 3l10 18H2zM12 10v5M12 18v.5'), infoIcon = icon('M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v6M12 7.5v.5'), close = icon('M6 6l12 12M18 6L6 18')
const arrow = icon('M5 12h14M13 6l6 6-6 6')
const msg = (tone, text, dismiss) => `<div class="message message-${tone}" role="${tone === 'problem' ? 'alert' : 'status'}">${tone === 'problem' ? alertIcon : infoIcon}<p>${text}</p>${
  dismiss ? `<button class="button-quiet" type="button" aria-label="Dismiss">${close}</button>` : ''}</div>`
const texts = {
  ended: 'Your session has ended. Please reload the page to rejoin.', lost: 'Connection to the room was lost',
  'join-failed': 'Could not join the room. Please try again.', 'create-failed': 'Could not create a room. Please try again.'
}
const notices = {
  moved: 'The old link you followed now opens this address. Please update your invitation or bookmark to use it.',
  restarted: 'Reconnected. Please check your vote.'
}
// The problem slot shows one message: ended, then lost, then a failure (App.tsx's connectionMessage || error); the stack follows the tone
const problem = ['ended', 'lost', 'join-failed', 'create-failed'].find(f => flags.includes(f))
const dismissed = new Set()
const banners = () => [...(problem ? [msg('problem', texts[problem])] : []),
  ...['moved', 'restarted'].filter(f => flags.includes(f) && !dismissed.has(f)).map(f => `<div data-notice="${f}">${msg('notice', notices[f], true)}</div>`)].join('')

const logo = `<span class="brand-logo" aria-hidden="true"><svg viewBox="30 31 51.2 39"><path fill="currentColor" fill-rule="evenodd" d="M34 31 H76 a5.2 5.2 0 0 1 0 10.4 H67 V66 a4 4 0 0 1 -4 4 H34 a4 4 0 0 1 -4 -4 V35 a4 4 0 0 1 4 -4 Z M40 41.4 H57 V59.6 H40 Z"/></svg></span>`
const header = `<header class="lobby-page-header"><div class="lobby-page-column">${logo}<span class="brand-logo-name">Pointing Poker</span></div></header>`

const rowLabel = remembered === 'legacy' ? 'your last room' : id('caring-striped-hamster')
const rejoinRow = () => remembered === 'none' ? '' :
  `<a class="room-row" href="#"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(rowLabel)}</span> <span class="room-row-line2">${typedLabel ? `Rejoin as ${esc(typedLabel)}` : 'Rejoin'}</span></span><span class="room-row-go${chip ? ' room-row-go-chip' : ''}" aria-hidden="true">${arrow}</span></a>`
const badge = `<div class="room-row"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(room)}</span></span></div>`

const dis = ended ? ' disabled' : ''
const nameField = `<label class="lobby-form-label" for="name">Your name</label><input class="lobby-form-input" id="name" type="text" value="${esc(typedName)}"${dis}>`
const roles = `<fieldset class="lobby-form-roles" aria-describedby="help"><legend class="lobby-form-label">Your default role</legend><div class="lobby-form-radios">${['Voter', 'Facilitator'].map(r =>
  `<label class="lobby-form-label"><input class="lobby-form-radio" type="radio" name="role" value="${r}"${r === role ? ' checked' : ''}${dis}> ${r}</label>`).join('')}</div>
  <small class="lobby-form-help" id="help">Used for rooms you have not joined before. In a room you have joined before, you keep your previous role there.</small></fieldset>`
const form = (heading, extra, button) => `<h1 class="lobby-page-title" tabindex="-1">${heading}</h1>${extra}${nameField}${roles}<button type="button" class="button button-primary"${dis}>${button}</button>`

function rootForm() {
  const tabs = `<nav class="lobby-tabs" aria-label="Create or join"><a href="#" ${tab === 'create' ? 'aria-current="true"' : ''} data-tab="create">Create</a><a href="#" ${tab === 'join' ? 'aria-current="true"' : ''} data-tab="join">Join</a></nav>`
  const roomField = `<label class="lobby-form-label" for="room">Room id</label><input class="lobby-form-input lobby-form-input-mono" id="room" type="text" value="">`
  return tab === 'create' ? `<h1 class="lobby-page-title" tabindex="-1">Create room</h1>${rejoinRow()}${tabs}${nameField}${roles}<button type="button" class="button button-primary">Create</button>`
    : `<h1 class="lobby-page-title" tabindex="-1">Join room</h1>${rejoinRow()}${tabs}${roomField}${nameField}${roles}<button type="button" class="button button-primary">Join</button>`
}
const pinnedForm = () => form('Join room', badge, 'Join')

function notARoom() {
  const row = suggestion ? `<p class="lobby-page-lead">Did you mean</p>
    <a class="room-row" href="#"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(suggestion)}</span> <span class="room-row-line2" id="join-line">Join</span></span><span class="room-row-go room-row-go-primary" aria-hidden="true">${arrow}</span></a>` : ''
  const other = `<a class="button button-${suggestion ? 'outline' : 'primary'}" href="lobby.html?tab=join">Join a different room</a>`
  return `<h1 class="lobby-page-title"><code><bdi>${esc(typed)}</bdi></code> is not a room name.</h1>${row}${other}`
}

function draw() {
  const body = page === 'notaroom' ? notARoom() : page === 'pinned' ? pinnedForm() : rootForm()
  const list = page === 'notaroom' ? '' : banners()
  document.getElementById('root').innerHTML = `${header}<main class="lobby-page-main"><div class="lobby-page-column">${list ? `<section class="lobby-page-banners" aria-label="Messages">${list}</section>` : ''}<div class="panel lobby-page-panel${ended ? ' lobby-page-inert' : ''}">${body}</div></div></main>`
  // Decision 13: "Join as <name>" from the stored name, textContent only; an empty stored name counts as none
  const line = document.getElementById('join-line')
  if (line && stored.trim()) line.textContent = 'Join as ' + stored.trim()
}
document.addEventListener('click', e => {
  const tabLink = e.target.closest('[data-tab]'), dismiss = e.target.closest('[aria-label="Dismiss"]')
  if (tabLink) { e.preventDefault(); tab = tabLink.dataset.tab; draw(); document.querySelector(`[data-tab="${tab}"]`).focus() }
  if (dismiss) { dismissed.add(dismiss.closest('[data-notice]').dataset.notice); draw(); document.querySelector('h1').focus() }   // 3b3 decision 5
  if (e.target.closest('a[href="#"]')) e.preventDefault()
})
draw()

if (q.get('probe') === '1') {
  const badgeOut = Object.assign(document.createElement('output'), { style: 'position:fixed;right:8px;bottom:8px;padding:4px 8px;background:var(--ink);color:var(--paper-warm);font:12px/1.4 var(--font-mono);z-index:9' })
  const show = () => { const px = parseFloat(getComputedStyle(document.documentElement).fontSize)
    badgeOut.textContent = `${innerWidth}×${innerHeight} · root ${px.toFixed(1)}px · ${(innerWidth / px).toFixed(1)} rem wide` }
  document.body.append(badgeOut); addEventListener('resize', show); show()
}
</script>
</body>
</html>
