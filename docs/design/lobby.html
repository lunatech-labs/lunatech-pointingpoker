<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby mockup (ui refresh step 3b4)</title>
<link rel="stylesheet" href="../../frontend/src/colours.css">
<link rel="stylesheet" href="../../frontend/src/tokens.css">
<style>
  @import url(../../frontend/src/reset.css) layer(base);
  @import url(../../frontend/src/page.css) layer(base);
  .room-row-go-chip { background: var(--paper-warm); border: var(--line-control) solid var(--ink); border-radius: var(--radius-card); }
</style>
<link rel="stylesheet" href="../../frontend/src/components/looks.css">
<link rel="stylesheet" href="../../frontend/src/components/message.css">
<link rel="stylesheet" href="../../frontend/src/components/lobby-page.css">
<link rel="stylesheet" href="../../frontend/src/components/room-row.css">
<link rel="stylesheet" href="../../frontend/src/components/lobby-tabs.css">
<link rel="stylesheet" href="../../frontend/src/components/lobby-form.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="root"></div>
<script src="icons.js"></script>
<script>
// Parameters: page (root | pinned | notaroom), tab, name, remembered (slug | legacy | none), rejoin=chip, role, message (comma list), room, typed, suggestion,
// stored, longest=1 (the 26-character id), probe=1; the lobby-cells page lists each with its meaning.
const q = new URLSearchParams(location.search)
const page = q.get('page') || 'root'
let tab = q.get('tab') === 'join' ? 'join' : 'create'
const longest = q.get('longest') === '1', longId = 'fearless-speckled-flamingo'
const id = fallback => longest ? longId : fallback
const typed = q.get('typed') ?? (longest ? `${longId}s` : 'brave-golden-oter')
const suggestion = q.has('suggestion') ? q.get('suggestion') : id('brave-golden-otter')
const room = q.get('room') || id('brave-golden-otter')
const stored = q.get('stored') ?? 'Alice'
const typedName = q.get('name') ?? 'Alice'
const typedLabel = typedName.trim()   // a blank typed name reads like none
const remembered = q.get('remembered') || 'slug'
const chip = q.get('rejoin') === 'chip'
const role = q.get('role') === 'facilitator' ? 'Facilitator' : 'Voter'
// Only the forms that can show a message draw it: a stream exists on the pinned form alone, Create on the root form alone
const shown = { root: ['join-failed', 'create-failed', 'moved', 'restarted'], pinned: ['join-failed', 'lost', 'ended', 'moved', 'restarted'] }[page] || []
const flags = (q.get('message') || '').split(',').filter(f => shown.includes(f))
const ended = flags.includes('ended')

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const alertIcon = icon('triangle-alert'), infoIcon = icon('info'), close = icon('x')
const arrow = icon('arrow-right')
const msg = (tone, text, dismiss) => `<div class="message message-${tone}" role="${tone === 'problem' ? 'alert' : 'status'}">${tone === 'problem' ? alertIcon : infoIcon}<p>${text}</p>${
  dismiss ? `<button class="button-quiet" type="button" aria-label="Dismiss">${close}</button>` : ''}</div>`
const texts = {
  ended: 'Your session has ended. Please reload the page to rejoin.', lost: 'Connection to the room was lost',
  'join-failed': 'Could not join the room. Please try again.', 'create-failed': 'Could not create a room. Please try again.'
}
const notices = {
  moved: 'The old link you followed now opens this address. Please update your invitation or bookmark to use it.',
  restarted: 'Reconnected. Please check your vote.'
}
// The problem slot shows one message: ended, then lost, then a failure (App.tsx's connectionMessage || error); the stack follows the tone
const problem = ['ended', 'lost', 'join-failed', 'create-failed'].find(f => flags.includes(f))
const dismissed = new Set()
const banners = () => [...(problem ? [msg('problem', texts[problem])] : []),
  ...['moved', 'restarted'].filter(f => flags.includes(f) && !dismissed.has(f)).map(f => `<div data-notice="${f}">${msg('notice', notices[f], true)}</div>`)].join('')

const logo = `<span class="brand-logo" aria-hidden="true"><svg viewBox="30 31 51.2 39"><path fill="currentColor" fill-rule="evenodd" d="M34 31 H76 a5.2 5.2 0 0 1 0 10.4 H67 V66 a4 4 0 0 1 -4 4 H34 a4 4 0 0 1 -4 -4 V35 a4 4 0 0 1 4 -4 Z M40 41.4 H57 V59.6 H40 Z"/></svg></span>`
const header = `<header class="lobby-page-header"><div class="lobby-page-column">${logo}<span class="brand-logo-name">Pointing Poker</span></div></header>`

const rowLabel = remembered === 'legacy' ? 'your last room' : id('caring-striped-hamster')
const rejoinRow = () => remembered === 'none' ? '' :
  `<a class="room-row" href="#"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(rowLabel)}</span> <span class="room-row-line2">${typedLabel ? `Rejoin as ${esc(typedLabel)}` : 'Rejoin'}</span></span><span class="room-row-go${chip ? ' room-row-go-chip' : ''}" aria-hidden="true">${arrow}</span></a>`
const badge = `<div class="room-row"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(room)}</span></span></div>`

const dis = ended ? ' disabled' : ''
const nameField = `<label class="lobby-form-label" for="name">Your name</label><input class="lobby-form-input" id="name" type="text" value="${esc(typedName)}"${dis}>`
const roles = `<fieldset class="lobby-form-roles" aria-describedby="help"><legend class="lobby-form-label">Your default role</legend><div class="lobby-form-radios">${['Voter', 'Facilitator'].map(r =>
  `<label class="lobby-form-label"><input class="lobby-form-radio" type="radio" name="role" value="${r}"${r === role ? ' checked' : ''}${dis}> ${r}</label>`).join('')}</div>
  <small class="lobby-form-help" id="help">Used for rooms you have not joined before. In a room you have joined before, you keep your previous role there.</small></fieldset>`
const form = (heading, extra, button) => `<h1 class="lobby-page-title" tabindex="-1">${heading}</h1>${extra}${nameField}${roles}<button type="button" class="button button-primary"${dis}>${button}</button>`

function rootForm() {
  const tabs = `<nav class="lobby-tabs" aria-label="Create or join"><a href="#" ${tab === 'create' ? 'aria-current="true"' : ''} data-tab="create">Create</a><a href="#" ${tab === 'join' ? 'aria-current="true"' : ''} data-tab="join">Join</a></nav>`
  const roomField = `<label class="lobby-form-label" for="room">Room id</label><input class="lobby-form-input lobby-form-input-mono" id="room" type="text" value="">`
  return tab === 'create' ? `<h1 class="lobby-page-title" tabindex="-1">Create room</h1>${rejoinRow()}${tabs}${nameField}${roles}<button type="button" class="button button-primary">Create</button>`
    : `<h1 class="lobby-page-title" tabindex="-1">Join room</h1>${rejoinRow()}${tabs}${roomField}${nameField}${roles}<button type="button" class="button button-primary">Join</button>`
}
const pinnedForm = () => form('Join room', badge, 'Join')

function notARoom() {
  const row = suggestion ? `<p class="lobby-page-lead">Did you mean</p>
    <a class="room-row" href="#"><span class="room-row-square" aria-hidden="true"></span><span class="room-row-text"><span class="room-row-id">${esc(suggestion)}</span> <span class="room-row-line2" id="join-line">Join</span></span><span class="room-row-go room-row-go-primary" aria-hidden="true">${arrow}</span></a>` : ''
  const other = `<a class="button button-${suggestion ? 'outline' : 'primary'}" href="lobby.html?tab=join">Join a different room</a>`
  return `<h1 class="lobby-page-title"><code><bdi>${esc(typed)}</bdi></code> is not a room name.</h1>${row}${other}`
}

function draw() {
  const body = page === 'notaroom' ? notARoom() : page === 'pinned' ? pinnedForm() : rootForm()
  const list = page === 'notaroom' ? '' : banners()
  document.getElementById('root').innerHTML = `${header}<main class="lobby-page-main"><div class="lobby-page-column">${list ? `<section class="lobby-page-banners" aria-label="Messages">${list}</section>` : ''}<div class="panel lobby-page-panel${ended ? ' lobby-page-inert' : ''}">${body}</div></div></main>`
  // 3b4 decision 13: "Join as <name>" from the stored name, textContent only; an empty stored name counts as none
  const line = document.getElementById('join-line')
  if (line && stored.trim()) line.textContent = 'Join as ' + stored.trim()
}
document.addEventListener('click', e => {
  const tabLink = e.target.closest('[data-tab]'), dismiss = e.target.closest('[aria-label="Dismiss"]')
  if (tabLink) { e.preventDefault(); tab = tabLink.dataset.tab; draw(); document.querySelector(`[data-tab="${tab}"]`).focus() }
  if (dismiss) { dismissed.add(dismiss.closest('[data-notice]').dataset.notice); draw(); document.querySelector('h1').focus() }   // 3b3 decision 5
  if (e.target.closest('a[href="#"]')) e.preventDefault()
})
draw()

if (q.get('probe') === '1') {
  const badgeOut = Object.assign(document.createElement('output'), { style: 'position:fixed;right:8px;bottom:8px;padding:4px 8px;background:var(--ink);color:var(--paper-warm);font:12px/1.4 var(--font-mono);z-index:9' })
  const show = () => { const px = parseFloat(getComputedStyle(document.documentElement).fontSize)
    badgeOut.textContent = `${innerWidth}×${innerHeight} · root ${px.toFixed(1)}px · ${(innerWidth / px).toFixed(1)} rem wide` }
  document.body.append(badgeOut); addEventListener('resize', show); show()
}
</script>
</body>
</html>
